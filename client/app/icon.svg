<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Transmission Tower -->
  <g stroke="#10201B" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Main Center Spire -->
    <line x1="50" y1="10" x2="50" y2="76" stroke-width="5" />
    
    <!-- Outer Legs -->
    <path d="M 50 15 L 30 76 M 50 15 L 70 76" stroke-width="5" />
    
    <!-- Inner Cross Bracing (X shapes) -->
    <path d="M 44 32 L 56 46 M 56 32 L 44 46" stroke-width="3" />
    <path d="M 39 46 L 61 63 M 61 46 L 39 63" stroke-width="3" />
    
    <!-- Top Crossbar -->
    <line x1="32" y1="28" x2="68" y2="28" stroke-width="5" />
    <line x1="32" y1="28" x2="32" y2="35" stroke-width="5" />
    <line x1="68" y1="28" x2="68" y2="35" stroke-width="5" />
    
    <!-- Lower Crossbar -->
    <line x1="22" y1="42" x2="78" y2="42" stroke-width="5" />
    <line x1="22" y1="42" x2="22" y2="50" stroke-width="5" />
    <line x1="78" y1="42" x2="78" y2="50" stroke-width="5" />
  </g>

  <!-- Waves -->
  <g stroke="#10201B" stroke-linecap="round" fill="none" stroke-width="5">
    <path d="M 5 80 C 20 70, 35 90, 50 80 C 65 70, 80 90, 95 80" />
    <path d="M 15 92 C 30 82, 45 102, 60 92 C 75 82, 90 102, 105 92" />
  </g>
</svg>
